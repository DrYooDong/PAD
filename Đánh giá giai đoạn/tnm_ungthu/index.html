<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đánh giá TNM - Oncology Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        .option-btn.active { 
            border-color: #0d9488 !important; 
            background-color: #f0fdfa !important; 
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
            font-weight: 700;
            color: #0f766e !important;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <div class="bg-teal-600 text-white p-2 rounded-xl shadow-sm">
                    <i class="fa-solid fa-staff-snake text-xl"></i>
                </div>
                <span class="font-black text-xl text-teal-800 tracking-tight">Onco<span class="text-sky-500">Portal</span></span>
                <span class="ml-2 text-xs font-semibold bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full border border-teal-200 hidden sm:inline-block">TNM & FIGO Calculator</span>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="editor.html" class="hidden md:flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow-sm">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Chỉnh sửa JSON</span>
                </a>
                
                <a href="../../index.html" class="text-slate-500 hover:text-teal-600 font-medium transition flex items-center gap-2 text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl border border-slate-200">
                    <i class="fa-solid fa-arrow-left"></i> <span>Quay lại Portal</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col">
        <!-- Top Toolbar -->
        <div class="bg-white border-b border-slate-200 p-4 shadow-sm z-10 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex-1 flex items-center gap-3">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest whitespace-nowrap">Chọn loại ung thư:</label>
                <select id="cancer-select" onchange="loadCancerType()" class="flex-1 max-w-xl p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none font-bold text-teal-900 bg-slate-50 text-base">
                </select>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-300">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Nạp JSON</span>
                    <input type="file" id="json-input" accept=".json" class="hidden" onchange="handleImportJsonFile(event)">
                </label>

                <button onclick="handleExportJsonFile()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-300">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Xuất JSON</span>
                </button>

                <a href="editor.html" class="md:hidden bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition border border-amber-500">
                    Chỉnh sửa
                </a>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6">
            <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div class="lg:col-span-8 space-y-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="text-teal-800 font-bold mb-4 flex items-center gap-2 border-b pb-3 text-base">
                            <span class="bg-teal-100 text-teal-700 w-6 h-6 flex items-center justify-center rounded-full text-xs font-black">T</span> 
                            Khối u nguyên phát (Tumor)
                        </h3>
                        <div id="t-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="text-teal-800 font-bold mb-4 flex items-center gap-2 border-b pb-3 text-base">
                            <span class="bg-teal-100 text-teal-700 w-6 h-6 flex items-center justify-center rounded-full text-xs font-black">N</span> 
                            Hạch vùng (Node)
                        </h3>
                        <div id="n-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="text-teal-800 font-bold mb-4 flex items-center gap-2 border-b pb-3 text-base">
                            <span class="bg-teal-100 text-teal-700 w-6 h-6 flex items-center justify-center rounded-full text-xs font-black">M</span> 
                            Di căn xa (Metastasis)
                        </h3>
                        <div id="m-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    </div>
                </div>

                <div class="lg:col-span-4">
                    <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-2xl sticky top-4 border-b-8 border-teal-500 overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <svg class="w-20 h-20" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path></svg>
                        </div>
                        
                        <h2 class="text-[10px] font-black uppercase text-slate-500 mb-6 tracking-[0.3em]">Kết quả chẩn đoán</h2>
                        
                        <div class="mb-8">
                            <p class="text-xs font-bold text-teal-500 uppercase mb-2">Mã hiệu TNM:</p>
                            <p id="res-tnm" class="text-4xl font-mono font-bold tracking-tighter">-- -- --</p>
                        </div>

                        <div class="mb-8 bg-slate-800 p-6 rounded-2xl border border-slate-700 relative">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-2">GIAI ĐOẠN (STAGE):</p>
                            <p id="res-stage" class="text-6xl font-black text-white leading-none">--</p>
                            <div id="res-extra" class="mt-4 text-sm font-bold text-teal-400 border-t border-slate-700 pt-3"></div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="copyResult()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-black py-4 rounded-2xl transition shadow-lg flex items-center justify-center gap-3 active:scale-95">
                                SAO CHÉP KẾT QUẢ
                            </button>
                            <button onclick="resetTool()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-400 py-3 rounded-2xl text-xs font-bold transition border border-slate-700">
                                LÀM MỚI (RESET)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
