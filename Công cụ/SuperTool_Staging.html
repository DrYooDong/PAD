<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Công Cụ - Đánh Giá Giai Đoạn | OncoPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .sidebar-active {
            background-color: #065f46 !important;
            color: #34d399 !important;
            border-left: 4px solid #34d399 !important;
            font-weight: 700;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 h-14 flex items-center justify-between px-3 md:px-4 shrink-0 z-30">
        <div class="flex items-center gap-2 md:gap-3 min-w-0">
            <!-- Mobile Menu Toggle -->
            <button onclick="toggleSidebar()" class="md:hidden text-slate-300 hover:text-white p-1.5 rounded-lg hover:bg-slate-700 transition" title="Danh mục công cụ">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            <a href="../index.html" class="text-slate-400 hover:text-white bg-slate-700/60 hover:bg-slate-700 px-2.5 md:px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shrink-0">
                <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Trang chủ Portal</span>
            </a>
            <div class="h-4 w-px bg-slate-700 hidden sm:block shrink-0"></div>
            <div class="flex items-center gap-2 min-w-0 truncate">
                <div class="bg-emerald-600 text-white p-1.5 rounded-lg text-sm shrink-0">
                    <i class="fa-solid fa-stethoscope"></i>
                </div>
                <h1 class="text-xs sm:text-base font-bold text-white tracking-tight truncate">
                    <span class="hidden md:inline">Siêu Công Cụ: </span><span class="text-emerald-400">Đánh Giá Giai Đoạn</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
            <!-- Quick Switcher to Other Super Tools -->
            <select id="super-tool-switcher" onchange="switchSuperTool(this.value)" class="bg-slate-700 text-slate-200 border border-slate-600 rounded-lg px-2 md:px-2.5 py-1 text-[11px] md:text-xs focus:outline-none focus:border-emerald-500 font-medium max-w-[130px] sm:max-w-none">
                <option value="SuperTool_Staging.html" selected>🩺 Trạm Đánh Giá Giai Đoạn</option>
                <option value="SuperTool_MedicalOncology.html">💊 Trạm Nội Khoa Ung Thư</option>
                <option value="SuperTool_Supportive.html">🩺 Trạm Hỗ Trợ & Độc Tính</option>
                <option value="SuperTool_Radiation.html">⚡ Trạm Xạ Trị Ung Bướu</option>
                <option value="SuperTool_Response.html">📊 Trạm Đánh Giá Đáp Ứng</option>
                <option value="SuperTool_Palliative.html">🕊️ Trạm Chăm Sóc Giảm Nhẹ</option>
            </select>

            <button onclick="reloadIframe()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700 transition" title="Tải lại công cụ">
                <i class="fa-solid fa-rotate-right text-xs md:text-sm"></i>
            </button>
            <button onclick="openExternal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700 transition" title="Mở trong cửa sổ mới">
                <i class="fa-solid fa-arrow-up-right-from-square text-xs md:text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Mobile Backdrop Overlay -->
        <div id="sidebar-backdrop" onclick="closeSidebar()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-40 w-72 md:w-64 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
            <div class="p-3 border-b border-slate-700/60 flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span>Danh mục công cụ</span>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] bg-emerald-900/60 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-700/50">3 Tools</span>
                    <button onclick="closeSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar">
                <button onclick="loadTool('../Đánh giá giai đoạn/tnm_ungthu/index.html', this)" class="tool-btn sidebar-active w-full text-left px-3 py-2.5 rounded-xl text-xs flex items-center gap-3 transition group">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 group-hover:text-white flex items-center justify-center text-sm shrink-0">
                        <i class="fa-solid fa-sitemap"></i>
                    </div>
                    <div class="truncate">
                        <div class="font-semibold truncate">Hệ Thống TNM & FIGO</div>
                        <div class="text-[10px] text-slate-400 truncate">Tính T, N, M & Sub-stages</div>
                    </div>
                </button>

                <button onclick="loadTool('../Đánh giá giai đoạn/phannhomNMTC.html', this)" class="tool-btn text-slate-300 hover:bg-slate-700/60 w-full text-left px-3 py-2.5 rounded-xl text-xs flex items-center gap-3 transition group">
                    <div class="w-7 h-7 rounded-lg bg-teal-500/20 text-teal-400 group-hover:text-white flex items-center justify-center text-sm shrink-0">
                        <i class="fa-solid fa-dna"></i>
                    </div>
                    <div class="truncate">
                        <div class="font-semibold truncate">Phân Nhóm Nguy Cơ FIGO 2023</div>
                        <div class="text-[10px] text-slate-400 truncate">Ung thư Nội mạc tử cung & Sinh học</div>
                    </div>
                </button>

                <button onclick="loadTool('../Đánh giá giai đoạn/phu khoa.html', this)" class="tool-btn text-slate-300 hover:bg-slate-700/60 w-full text-left px-3 py-2.5 rounded-xl text-xs flex items-center gap-3 transition group">
                    <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-sky-400 group-hover:text-white flex items-center justify-center text-sm shrink-0">
                        <i class="fa-solid fa-venus"></i>
                    </div>
                    <div class="truncate">
                        <div class="font-semibold truncate">Sơ Đồ Giai Đoạn Phụ Khoa</div>
                        <div class="text-[10px] text-slate-400 truncate">Buồng trứng, Cổ tử cung & Thân tử cung</div>
                    </div>
                </button>
            </nav>

            <div class="p-3 border-t border-slate-700/60 bg-slate-800/80 text-[11px] text-slate-400 flex items-center justify-between">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-emerald-400"></i> AJCC 8th & FIGO 2023</span>
            </div>
        </aside>

        <!-- Main Tool Viewing Area -->
        <main class="flex-1 bg-slate-950 flex flex-col relative overflow-hidden">
            <iframe id="tool-frame" onload="cleanIframeHeader()" src="../Đánh giá giai đoạn/tnm_ungthu/index.html" class="w-full h-full border-none"></iframe>
        </main>

    </div>

    <script>
        function cleanIframeHeader() {
            try {
                const frame = document.getElementById('tool-frame');
                if (!frame) return;
                const iframeDoc = frame.contentDocument || frame.contentWindow.document;
                if (iframeDoc && iframeDoc.head) {
                    let style = iframeDoc.getElementById('supertool-clean-style');
                    if (!style) {
                        style = iframeDoc.createElement('style');
                        style.id = 'supertool-clean-style';
                        style.textContent = `
                            header, .main-header, .back-link {
                                display: none !important;
                            }
                            body {
                                padding-top: 0 !important;
                                margin-top: 0 !important;
                            }
                        `;
                        iframeDoc.head.appendChild(style);
                    }
                }
            } catch(e) {}
        }

        function loadTool(url, btnElement) {
            document.getElementById('tool-frame').src = url;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('sidebar-active');
                btn.classList.add('text-slate-300');
            });
            if (btnElement) {
                btnElement.classList.add('sidebar-active');
                btnElement.classList.remove('text-slate-300');
            }
            closeSidebar();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const isHidden = sidebar.classList.contains('-translate-x-full');
            if (isHidden) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function reloadIframe() {
            const frame = document.getElementById('tool-frame');
            frame.src = frame.src;
        }

        function openExternal() {
            const frame = document.getElementById('tool-frame');
            window.open(frame.src, '_blank');
        }

        function switchSuperTool(val) {
            if (val) {
                window.location.href = val;
            }
        }
    </script>
</body>
</html>
