<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Nội dung TNM - Oncology Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <div class="bg-amber-600 text-white p-2 rounded-xl shadow-sm">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </div>
                <span class="font-black text-xl text-teal-800 tracking-tight">Onco<span class="text-sky-500">Portal</span></span>
                <span class="ml-2 text-xs font-semibold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full border border-amber-200 hidden sm:inline-block">TNM Data Editor</span>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-slate-500 hover:text-teal-600 font-medium transition flex items-center gap-2 text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl border border-slate-200">
                    <i class="fa-solid fa-arrow-left"></i> <span>Quay lại Công cụ</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col md:flex-row">
        <!-- Sidebar: Cancer List -->
        <div class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0">
            <div class="p-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Danh sách bệnh</span>
                <button onclick="createNewCancer()" class="bg-teal-600 hover:bg-teal-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow-sm">
                    <span>+ Thêm bệnh</span>
                </button>
            </div>
            
            <div id="cancer-list" class="flex-1 overflow-y-auto">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Main Content Editor -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50">
            <div class="max-w-4xl mx-auto space-y-6">
                
                <!-- Action bar -->
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                        <h2 class="text-sm font-bold text-slate-700">Thao tác dữ liệu</h2>
                        <p class="text-xs text-slate-400">Lưu vào bộ nhớ trình duyệt hoặc xuất file `data.js` để ghi đè vào thư mục</p>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="saveAllChanges()" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md flex items-center gap-1">
                            <span>💾 Lưu Trình Duyệt</span>
                        </button>
                        <button onclick="exportDataJsFile()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md flex items-center gap-1">
                            <span>📥 Tải File data.js</span>
                        </button>
                    </div>
                </div>

                <!-- Meta Info -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Thông tin chung</h3>
                        <button onclick="deleteCurrentCancer()" class="text-xs font-bold text-rose-600 hover:underline">Xóa bệnh này</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Mã định danh (Key):</label>
                            <input type="text" id="edit-key" readonly class="w-full p-2.5 bg-slate-100 border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-500">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Tên hiển thị:</label>
                            <input type="text" id="edit-name" onchange="saveMetaInfo()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Nóm loại bệnh (Group):</label>
                            <input type="text" id="edit-group" onchange="saveMetaInfo()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Ghi chú phân loại (Extra):</label>
                            <input type="text" id="edit-extra" onchange="saveMetaInfo()" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs">
                        </div>
                    </div>
                </div>

                <!-- T criteria -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h3 class="font-bold text-teal-800 text-sm uppercase tracking-wider">Tiêu chuẩn U nguyên phát (T)</h3>
                        <button onclick="addItem('T')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg font-bold border border-slate-300">+ Thêm T</button>
                    </div>
                    <div id="t-items-container"></div>
                </div>

                <!-- N criteria -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h3 class="font-bold text-teal-800 text-sm uppercase tracking-wider">Tiêu chuẩn Hạch vùng (N)</h3>
                        <button onclick="addItem('N')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg font-bold border border-slate-300">+ Thêm N</button>
                    </div>
                    <div id="n-items-container"></div>
                </div>

                <!-- M criteria -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h3 class="font-bold text-teal-800 text-sm uppercase tracking-wider">Tiêu chuẩn Di căn xa (M)</h3>
                        <button onclick="addItem('M')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg font-bold border border-slate-300">+ Thêm M</button>
                    </div>
                    <div id="m-items-container"></div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
